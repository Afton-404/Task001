<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задачи на оценку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h3>1. Копилка</h3>
    <input type="number" id="piggyAmount">
    <button onclick="doPut()">+</button>
    <button onclick="doTake()">−</button>
    <div id="piggyOut"></div>

    <h3>2. Животные</h3>
    <input type="text" id="animalName">
    <select id="animalType">
        <option value="animal">Animal</option>
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
    </select>
    <button onclick="addAnimal()">Добавить</button>
    <div id="animalOut"></div>

    <h3>3. Задачи</h3>
    <input type="text" id="taskTitle">
    <button onclick="addTask()">Добавить</button>
    <div id="taskOut"></div>

<script src="script.js"></script>

</body>
</html>
